{% extends "core/base.html" %}

{% block content %}
<section class="crm-page-v2">
  <div class="container">
    <div class="crm-layout-v2">
      <aside class="crm-sidebar-v2">
        <div class="crm-brand-v2">
          <span class="crm-brand-mark">A</span>
          <div>
            <strong>CRM Апельсин</strong>
            <small>Панель администратора</small>
          </div>
        </div>

        <nav class="crm-nav-v2">
          <a href="{% url 'crm:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Дашборд</a>
          <a href="{% url 'crm:appointments' %}" class="{% if request.resolver_match.url_name == 'appointments' %}active{% endif %}">Заявки</a>
          <a href="{% url 'crm:clients' %}" class="{% if request.resolver_match.url_name == 'clients' or request.resolver_match.url_name == 'client_detail' %}active{% endif %}">Клиенты</a>
          <a href="{% url 'admin:index' %}">Django Admin</a>
        </nav>

        <form method="post" action="{% url 'crm:logout' %}" class="crm-logout-v2">
          {% csrf_token %}
          <button type="submit">Выйти</button>
        </form>
      </aside>

      <div class="crm-main-v2">
        {% block crm_content %}{% endblock %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
