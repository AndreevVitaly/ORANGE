{% extends "core/base.html" %}

{% block title %}Вход для сотрудников — центр «Апельсин»{% endblock %}

{% block content %}
<section class="page-section section-alt">
  <div class="container">
    <div class="form-page-card login-card">
      <h1 class="page-title">Вход для сотрудников</h1>
      <p class="text-muted">Используй учетную запись администратора центра.</p>

      {% if form.errors %}
        <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'/crm/' }}">

        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя</label>
          <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" class="form-control" autocomplete="username" required autofocus>
        </div>

        <div class="mb-3">
          <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
          <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" class="form-control" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
